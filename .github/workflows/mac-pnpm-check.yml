# A Mac user (Apple Silicon, pnpm 12.21.0) could not install a new project: E021, while `pnpm -v`
# works in their Terminal (2026-11-20). Run 2 showed why a pnpm 12 whose install script did not
# run cannot be started by Node without a shell (ENOEXEC). This run checks the fix with
# KumiCraft's own code on such a pnpm. Push to the branch `mac-check` to run it.
name: mac-pnpm-check

on:
  push:
    branches: [mac-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The repository's own pnpm through npx, so the pnpm on the PATH stays the user's one.
      - run: npx --yes pnpm@10.34.6 install --frozen-lockfile

      # The user's pnpm, half installed: its install script (which swaps the launcher script
      # without `#!` for the native binary) is blocked, as in run 2.
      - run: npm install -g pnpm@12.21.0 --ignore-scripts
      - name: The pnpm on the PATH is the script without `#!`
        run: |
          file "$(realpath "$(which pnpm)")"
          bash -c 'pnpm -v'

      - name: Unit tests of the fix
        working-directory: packages/server
        run: >-
          npx vitest run src/adapters/system/spawn-failure.test.ts
          src/core/project/install-package-manager.test.ts

      - name: pnpm install of the KumiCraft template, started by KumiCraft's code
        run: |
          APP="$RUNNER_TEMP/my-app"
          cp -R templates/vite-react-ts-tailwind4 "$APP"
          sed -i '' 's/{{packageName}}/my-app/' "$APP/package.json"
          node --input-type=module -e '
            import { createNodeProcess } from "./packages/server/src/adapters/system/node-process.ts";
            import { probeMachine } from "./packages/server/src/adapters/system/machine-info.ts";
            const proc = createNodeProcess();
            console.log("machine line of the log:", JSON.stringify(await probeMachine(proc), null, 2));
            const handle = proc.spawn("pnpm", ["install"], { cwd: process.argv[1] });
            handle.onLine((line) => console.log("  ", line));
            const out = await handle.wait();
            console.log("pnpm install exit:", out.exitCode, out.spawnError ?? "");
            process.exit(out.exitCode === 0 ? 0 : 1);
          ' "$APP"
          test -d "$APP/node_modules/vite"
