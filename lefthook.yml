# SPEC-02 section 11.3
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,css}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx}'
      # Templates and fixtures are whole projects with their own ESLint config, which ESLint 10
      # would pick for their files; the repository lint skips them (eslint.config.js ignores).
      exclude:
        - 'templates/**'
        - 'fixtures/**'
      run: pnpm eslint {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
