# SPEC-02 section 11.3
pre-commit:
  parallel: true
  commands:
    # The runner reads the staged files from git and works in batches: a list of every path on
    # one command line breaks on Windows for a large commit.
    format:
      glob: '*.{ts,tsx,js,json,md,css}'
      run: node scripts/run-staged.mjs format
    lint:
      glob: '*.{ts,tsx}'
      run: node scripts/run-staged.mjs lint
    # docs/architecture/03 section 6.4: the dependency rules, with the list of old violations.
    deps:
      glob: 'packages/{server,studio}/src/**/*.{ts,tsx}'
      run: pnpm run lint:deps
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
